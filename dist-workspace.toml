[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# `release.yml` is generated by dist, but Dependabot also updates every file under
# .github/workflows and offers no way to exclude one — so the two disagreed and
# `dist plan` failed the drift check on every actions bump.
#
# `actions/checkout` is the only action shared between the generated file and the
# hand-written ci.yml/docs.yml, so ignoring it in Dependabot would freeze the real
# CI's pin instead. Handing the file to Dependabot is the option that keeps both
# sets of pins current.
#
# The cost: dist no longer regenerates or drift-checks release.yml, so a dist
# upgrade needs it re-generated by hand (drop this key, run `dist init`, restore
# it), and a bad bump here surfaces at release time rather than in CI.
allow-dirty = ["ci"]
