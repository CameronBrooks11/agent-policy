name: Publish to crates.io

# Publishes the crate from the tagged source with crates.io trusted
# publishing (OIDC), so no crates.io token is stored anywhere.
#
# Runs on the v* tag push itself, in parallel with Release, or on manual
# dispatch. Unlike pypi-publish.yml and npm-publish.yml it cannot follow
# Release with workflow_run: crates.io refuses OIDC tokens from that
# trigger ("Trusted Publishing does not support the `workflow_run` event
# trigger"). cargo publish builds from source, so it does not need
# Release's binaries; the crates-io environment's required reviewer is
# the gate.
#
# crates.io trusted publisher: repository CameronBrooks11/agent-policy,
# workflow crates-publish.yml, environment crates-io.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.7.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/agent-policy
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
